name: Generate Daily Carousel

on:
  # FULLY DISABLED - uncomment to re-enable
  # schedule:
  #   - cron: '0 17 * * *'

  workflow_dispatch:

jobs:
  generate-carousel:
    if: false  # DISABLED - remove this line to re-enable
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download fonts if missing
        run: |
          mkdir -p fonts
          if [ ! -f fonts/BebasNeue-Regular.ttf ]; then
            wget -O fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf
          fi
          if [ ! -f fonts/Montserrat-Bold.ttf ]; then
            wget -O fonts/Montserrat-Bold.ttf https://github.com/google/fonts/raw/main/apache/montserrat/static/Montserrat-Bold.ttf
          fi

      - name: Set up credentials
        env:
          GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          # Create config directories
          mkdir -p config
          mkdir -p src/config

          # Create .env file
          echo "GOOGLE_SHEET_ID=$GOOGLE_SHEET_ID" > .env
          echo "SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN" >> .env
          echo "SLACK_CHANNEL_ID=$SLACK_CHANNEL_ID" >> .env
          echo "INSTAGRAM_AUTO_POST=true" >> .env
          echo "INSTAGRAM_USERNAME=$INSTAGRAM_USERNAME" >> .env
          echo "INSTAGRAM_PASSWORD=$INSTAGRAM_PASSWORD" >> .env

          # Create Google Cloud credentials (for Sheets)
          printf '%s' "$GOOGLE_CLOUD_CREDENTIALS" > src/config/credentials.json
          echo "GOOGLE_SHEETS_CREDS=src/config/credentials.json" >> .env

          # Restore Instagram session from GitHub Secret (raw JSON)
          if [ -n "$INSTAGRAM_SESSION" ]; then
            printf '%s' "$INSTAGRAM_SESSION" > src/config/instagram_session.json

            # Verify it's valid JSON
            if [ -s src/config/instagram_session.json ]; then
              FILE_SIZE=$(wc -c < src/config/instagram_session.json)
              echo "✅ Instagram session restored ($FILE_SIZE bytes)"

              if python3 -m json.tool src/config/instagram_session.json > /dev/null 2>&1; then
                echo "✅ Session is valid JSON"
              else
                echo "❌ Invalid JSON in session file"
                exit 1
              fi
            else
              echo "❌ Session file is empty"
              exit 1
            fi
          else
            echo "⚠️  No INSTAGRAM_SESSION secret found"
            exit 1
          fi

      - name: Generate and post carousel
        id: generate
        run: |
          python3 src/carousel_main.py
        continue-on-error: true

      - name: Upload carousel artifact (7 day backup)
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: carousel-${{ github.run_number }}
          path: output/carousels/**/*.png
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          rm -f src/config/credentials.json
          rm -f src/config/instagram_session.json
          rm -f .env

      - name: Notify Slack on failure
        if: steps.generate.outcome == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            ❌ CAROUSEL GENERATION FAILED

            Run: ${{ github.run_number }}
            Time: Manual trigger

            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
