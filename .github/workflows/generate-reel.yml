name: Generate Angel Number Reel

on:
  schedule:
    # 4 AM EST = 9 AM UTC → targets ~6-7 AM EST after GitHub delay
    - cron: '0 9 * * *'
    # 11 AM EST = 4 PM UTC → targets ~1-2 PM EST after GitHub delay
    - cron: '0 16 * * *'
    # 4 PM EST = 9 PM UTC → targets ~6-7 PM EST after GitHub delay
    - cron: '0 21 * * *'

  workflow_dispatch:  # Manual trigger - keep enabled for testing

jobs:
  generate-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download fonts if missing
        run: |
          mkdir -p fonts
          if [ ! -f fonts/BebasNeue-Regular.ttf ]; then
            wget -O fonts/BebasNeue-Regular.ttf https://github.com/google/fonts/raw/main/ofl/bebasneue/BebasNeue-Regular.ttf
          fi
          if [ ! -f fonts/Montserrat-Bold.ttf ]; then
            wget -O fonts/Montserrat-Bold.ttf https://github.com/google/fonts/raw/main/apache/montserrat/static/Montserrat-Bold.ttf
          fi

      - name: Set up credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLOUD_CREDENTIALS: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          # Create config directory first
          mkdir -p config

          # Create .env file
          echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" > .env
          echo "PEXELS_API_KEY=$PEXELS_API_KEY" >> .env
          echo "PIXABAY_API_KEY=$PIXABAY_API_KEY" >> .env
          echo "GOOGLE_SHEET_ID=$GOOGLE_SHEET_ID" >> .env
          echo "SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN" >> .env
          echo "SLACK_CHANNEL_ID=$SLACK_CHANNEL_ID" >> .env
          echo "INSTAGRAM_AUTO_POST=true" >> .env
          echo "INSTAGRAM_USERNAME=$INSTAGRAM_USERNAME" >> .env
          echo "INSTAGRAM_PASSWORD=$INSTAGRAM_PASSWORD" >> .env

          # Create Google Cloud credentials (for TTS and Sheets)
          if [ -z "$GOOGLE_CLOUD_CREDENTIALS" ]; then
            echo "ERROR: GOOGLE_CLOUD_CREDENTIALS secret is empty!"
            exit 1
          fi
          printf '%s' "$GOOGLE_CLOUD_CREDENTIALS" > config/credentials.json

          # Validate JSON
          if ! python3 -m json.tool config/credentials.json > /dev/null 2>&1; then
            echo "ERROR: Google Cloud credentials.json is not valid JSON!"
            echo "File size: $(wc -c < config/credentials.json) bytes"
            head -c 200 config/credentials.json
            exit 1
          fi

          echo "GOOGLE_APPLICATION_CREDENTIALS=config/credentials.json" >> .env

          # Use same credentials for Google Sheets (same service account)
          echo "GOOGLE_SHEETS_CREDS=config/credentials.json" >> .env

          # Restore Instagram session from GitHub Secret (raw JSON)
          if [ -n "$INSTAGRAM_SESSION" ]; then
            printf '%s' "$INSTAGRAM_SESSION" > config/instagram_session.json

            # Verify it's valid JSON
            if [ -s config/instagram_session.json ]; then
              FILE_SIZE=$(wc -c < config/instagram_session.json)
              echo "✅ Instagram session restored ($FILE_SIZE bytes)"

              if python3 -m json.tool config/instagram_session.json > /dev/null 2>&1; then
                echo "✅ Session is valid JSON"
              else
                echo "❌ Invalid JSON in session file"
                exit 1
              fi
            else
              echo "❌ Session file is empty"
              exit 1
            fi
          else
            echo "⚠️  No INSTAGRAM_SESSION secret found"
            exit 1
          fi

      - name: Generate reel
        id: generate
        run: |
          # Determine which reel to generate based on schedule
          # 4 AM EST (09:00 UTC) = Reel 1 → targets ~6 AM EST
          # 11 AM EST (16:00 UTC) = Reel 2 → targets ~1 PM EST
          # 4 PM EST (21:00 UTC) = Reel 3 → targets ~6 PM EST
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 9 ] && [ "$HOUR" -le 11 ]; then
            REEL_NUM=1
          elif [ "$HOUR" -ge 16 ] && [ "$HOUR" -le 18 ]; then
            REEL_NUM=2
          elif [ "$HOUR" -ge 21 ] || [ "$HOUR" -le 1 ]; then
            REEL_NUM=3
          else
            # Manual trigger - generate all 3 reels
            REEL_NUM=""
          fi

          if [ -n "$REEL_NUM" ]; then
            echo "Scheduled run: Generating reel $REEL_NUM/3"
            python3 src/main.py --reel-number $REEL_NUM
          else
            echo "Manual run: Generating all reels"
            python3 src/main.py
          fi
        continue-on-error: true

      - name: Upload video artifact (7 day backup)
        if: steps.generate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ github.run_number }}
          path: output/*.mp4
          retention-days: 7

      - name: Cleanup temp files
        if: always()
        run: |
          rm -rf output/temp_*
          rm -rf output/*TEMP*
          rm -f config/credentials.json
          rm -f config/instagram_session.json
          rm -f .env

      - name: Notify Slack on failure
        if: steps.generate.outcome == 'failure'
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            ❌ REEL GENERATION FAILED

            Run: ${{ github.run_number }}
            Time: ${{ github.event.schedule || 'Manual trigger' }}
            Workflow: ${{ github.workflow }}

            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
